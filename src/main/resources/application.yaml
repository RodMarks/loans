spring:
  application:
    name: loans
  h2:
    console:
      enabled: true
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password: ''
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
server:
  port: ${SERVER_PORT:8090}

logging:
  pattern:
    console: ${CONSOLE_LOG_PATTERN:%green(%d{yyyy-MM-dd HH:mm:ss}) %blue(%-5level) %red([%thread]) %yellow(%logger{15})- %cyan(%msg%n)}

app:
  openapi:
    title: Loans microservice REST API Documentation
    description: IonicaBank Loans microservice REST API Documentation
    version: '@project.version@'
    url: https://www.ionicalabs.com
    contact:
      name: Rodmarks
      email: rodmarks@ionicalabs.com
    license:
      name: IonicaBank
